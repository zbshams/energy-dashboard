steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/energy-dashboard:latest', '.']
  
  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/energy-dashboard:latest']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - run
      - --filename=.
      - '--image=gcr.io/$PROJECT_ID/energy-dashboard:latest'
      - '--location=us-central1'
      - '--config=./cloud-run-config.yaml'

images:
  - 'gcr.io/$PROJECT_ID/energy-dashboard:latest'

options:
  machineType: 'N1_HIGHCPU_8'
